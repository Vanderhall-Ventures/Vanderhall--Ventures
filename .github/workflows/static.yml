name: Validate static site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate HTML and local references
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          root = Path(".")
          html_files = sorted(root.glob("*.html"))
          if not html_files:
              raise SystemExit("No HTML files found")

          errors = []

          class SiteParser(HTMLParser):
              def __init__(self, page):
                  super().__init__()
                  self.page = page
                  self.ids = set()

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  element_id = values.get("id")
                  if element_id:
                      if element_id in self.ids:
                          errors.append(f"{self.page}: duplicate id #{element_id}")
                      self.ids.add(element_id)

                  for attribute in ("href", "src"):
                      value = values.get(attribute)
                      if not value:
                          continue
                      if value.startswith(("#", "http://", "https://", "mailto:", "tel:", "data:", "/_vercel/")):
                          continue
                      path = unquote(urlsplit(value).path)
                      target = (self.page.parent / path).resolve()
                      if not target.exists():
                          errors.append(f"{self.page}: missing local {attribute} target {value}")

          for page in html_files:
              parser = SiteParser(page)
              try:
                  parser.feed(page.read_text(encoding="utf-8"))
                  parser.close()
              except Exception as exc:
                  errors.append(f"{page}: HTML parse error: {exc}")

          if errors:
              raise SystemExit("\n".join(errors))

          print(f"Validated {len(html_files)} HTML files and their local references.")
          PY
